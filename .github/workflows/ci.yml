name: ci

on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Ensure go modules are tidy
        run: |
          go mod tidy
          if [[ -n $(git status -s) ]] ; then
            echo
            echo -e "\e[31mRunning 'go mod tidy' changes the current setting"
            echo -e "\e[31mEnsure to include updated go.mod and go.sum in this PR."
            echo -e "\e[31mThis is usually done by running 'go mod tidy'\e[0m"
            git status -s
            git diff --color
            exit 1
          fi

      - name: Ensure generated files are up to date
        run: |
          go generate ./...
          if [[ -n $(git status -s) ]] ; then
            echo
            echo -e "\e[31mRunning 'go generate ./...' changes the current setting"
            echo -e "\e[31mEnsure to include the regenerated files in this PR."
            echo -e "\e[31mThis is usually done by running 'go generate ./...'\e[0m"
            git status -s
            git diff --color
            exit 1
          fi

      - name: Run linters
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest

  # Compute the OS matrix once: pull requests run Linux only (fast feedback on
  # pure-Go logic), while a push to main runs the full cross-OS matrix that
  # guards the release binaries. This keeps PR checks lean without losing
  # macOS/Windows coverage before anything lands on main.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      os: ${{ steps.set.outputs.os }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo 'os=["ubuntu-latest", "macos-latest", "windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # Single job that both builds and tests, matrixed over the OS set computed
  # above. Folding build into test removes a redundant compile pass (test
  # already builds the packages it exercises).
  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - run: go mod download

      - run: make build

      - run: make test
